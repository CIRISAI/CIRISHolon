# Deploy the interactive demos (docs/) to GitHub Pages.
# The atom world (RENDER-1/ATOM-1) publishes here; the README links to it,
# because GitHub READMEs cannot execute WASM or scripts.
#
# TWO demos, built two different ways, on purpose:
#
#   docs/atoms/    the 2D canvas shell. Its wasm is ~115 KB and IS committed — small
#                  enough that having the exact deployed bytes in the record is worth
#                  more than the diff noise.
#   docs/atoms3d/  the 3D Bevy shell. Its two wasm artifacts are ~30 MB EACH, so they are
#                  built HERE and never committed; git would carry 60 MB per rebuild
#                  forever. Only the page (index.html) is in the repo. This mirrors
#                  CIRISGame's pages workflow, which builds its Bevy bundle the same way
#                  and for the same reason.
name: pages
on:
  push:
    branches: [main]
    # The 3D artifacts are built from source here, so a change to the crate has to be
    # able to trigger a deploy even when nothing under docs/ moved.
    paths:
      - "docs/**"
      - "engine/crates/holon-render-3d/**"
      - "engine/crates/holon-render/**"
      - "engine/crates/holon-chem/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    name: Build the 3D bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # binaryen supplies wasm-opt for the post-bindgen size pass. Pinned to the official
      # release tarball, NOT `apt-get install binaryen`: Ubuntu's packaged build
      # mis-binds `__wbindgen_externrefs` to the funcref table under -Oz, and
      # wasm-bindgen's init then dies with "failed to grow table by 4". Same pin, same
      # reason, as CIRISGame's workflow.
      - name: Install binaryen (wasm-opt)
        run: |
          BINARYEN=version_130
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-bin: false
          workspaces: engine/crates/holon-render-3d
          key: pages-atoms3d

      # The CLI version must match the `wasm-bindgen` crate in the crate's Cargo.lock or
      # wasm-bindgen hard-errors ("expected version X, found Y"). Read from the lockfile
      # rather than pinned here, so the two cannot drift apart.
      - name: Install wasm-bindgen-cli
        run: |
          want=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[",]/, "", $3); print $3; exit}' \
            engine/crates/holon-render-3d/Cargo.lock)
          echo "wasm-bindgen $want"
          cargo install wasm-bindgen-cli --version "$want" --locked

      # Guarded: if the 3D build fails the deploy still serves the 2D shell and the
      # landing page rather than failing the whole site. The 3D page then reports that
      # neither backend would load, which is the truth rather than a blank screen.
      - name: Build both browser artifacts
        continue-on-error: true
        run: ./engine/crates/holon-render-3d/build-web.sh

      # The workbench's engine, REBUILT FROM THE COMMIT BEING DEPLOYED.
      #
      # docs/workbench/holon_render.wasm is committed — 315 KB, the same order as
      # docs/atoms', and small enough that the page works from a bare checkout. But a
      # committed build artifact goes stale the moment holon-render or holon-chem moves,
      # and both are edited by many lanes: at the time this step was added,
      # docs/atoms/holon_render.wasm was two commits behind
      # crates/holon-render/viewer/holon_render.wasm, which was itself 300,756 bytes
      # against the 310,849 its own source builds — and NOTHING in ci-gates.sh compared
      # either to its source (gate 10 covers holon-sandbox only).
      #
      # Rebuilding here makes "what ships is what the deployed commit's source builds" a
      # property of the pipeline rather than of anyone remembering. The alternative
      # considered and rejected was a byte-identity gate in the style of gate 10: on a
      # main taking dozens of commits a day across holon-chem, that gate would be red for
      # lanes that have never heard of the workbench, and the guarantee it buys is the one
      # this step already provides by construction.
      #
      # NOT continue-on-error. The 3D step above may fail and still leave a truthful site;
      # this one cannot. If it fails the committed bytes would be served while the page's
      # manifest presented them as the current engine, and a stale artifact wearing a
      # fresh commit's provenance is the exact shape the workbench page exists to refuse.
      - name: Rebuild the workbench engine from this commit
        run: |
          HOLON_RENDER_WASM_OUT="$PWD/docs/workbench/holon_render.wasm" \
            bash engine/crates/holon-render/build-web.sh
          sha256sum docs/workbench/holon_render.wasm

      - name: Report what is being deployed
        run: |
          echo "docs/ tree:"
          find docs -type f -printf '%10s  %p\n' | sort -k2

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
