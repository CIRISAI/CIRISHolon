name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    name: Object contract (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      # The build alone does not gate admitted gaps: `lake build --wfail` relies on
      # Lean's own "declaration uses 'sorry'" warning, which `#guard_msgs` swallows,
      # and it cannot see a gap inherited from an import. Asking the proof assistant
      # what each theorem DEPENDS ON is the check that cannot be talked around.
      # This file's own elaboration is the gate, and it carries the demonstration
      # that the gate fires.
      - name: Axiom audit (no sorries, standard axioms only)
        working-directory: lean
        run: lake env lean Audit/AxiomAudit.lean

  engine:
    name: Engine gates (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - name: Install WebAssembly targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      # The gravity instruments (gate 10c) are numpy programs; the bare runner has
      # python3 and nothing else, so without this the gate's import prong fires on
      # every run regardless of the physics. numpy only -- the prereg audit and the
      # rest of the record are stdlib-pure and should stay that way.
      - name: Install numpy (gravity instruments)
        run: python3 -m pip install --quiet numpy
      - name: ci-gates
        run: ./ci-gates.sh
