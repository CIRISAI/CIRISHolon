name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    name: Object contract (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
