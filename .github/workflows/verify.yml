name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    name: Object contract (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      # The build alone does not gate admitted gaps: `lake build --wfail` relies on
      # Lean's own "declaration uses 'sorry'" warning, which `#guard_msgs` swallows,
      # and it cannot see a gap inherited from an import. Asking the proof assistant
      # what each theorem DEPENDS ON is the check that cannot be talked around.
      # This file's own elaboration is the gate, and it carries the demonstration
      # that the gate fires.
      - name: Axiom audit (no sorries, standard axioms only)
        working-directory: lean
        run: lake env lean Audit/AxiomAudit.lean

  engine:
    name: Engine gates (Rust)
    runs-on: ubuntu-latest
    # RAISED 40 -> 75 on 2026-09-03, from the clock rather than from a feeling, and it
    # hides no failure. The last four runs were CANCELLED at exactly 40:00 with no gate
    # having failed: run 33722596717 passed every gate through "holon-chem
    # referee/FCI/pair/E1" at 06:55:20 and was killed at 06:58 with five gates left (the
    # holon-render suites, q8-mps C2, the two wasm artifacts) — all five green in a full
    # local run of the same script the same night (57 PASS). The last SUCCESS was
    # 09-02T16:05, at 33 minutes; the suite has grown since (the water door, the shipped
    # (O,O) curve, a stepping water scene in the smoke gate) and now needs ~50.
    #
    # OWNER: ci-manager. EXIT: this is a budget, not a fix — the job wants splitting (the
    # per-crate gates and the two artifact gates are independent) or the long poles want
    # profiling. A timeout that cancels a green run teaches everyone to ignore the
    # workflow, which is the state this raise is undoing.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - name: Install WebAssembly targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      # The gravity instruments (gate 10c) are numpy programs; the bare runner has
      # python3 and nothing else, so without this the gate's import prong fires on
      # every run regardless of the physics. numpy only -- the prereg audit and the
      # rest of the record are stdlib-pure and should stay that way.
      - name: Install numpy (gravity instruments)
        run: python3 -m pip install --quiet numpy
      - name: ci-gates
        run: ./ci-gates.sh
