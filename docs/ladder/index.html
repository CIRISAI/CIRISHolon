<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0e" />
    <title>CIRISHolon · from the vacuum to the universe</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f0e; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; color: #ede9df; font: 14px sans-serif; text-align: center; }
    </style>
  </head>
  <body data-engine="loading">
    <canvas id="c" aria-label="One zoom from the vacuum to the universe. Wheel or pinch to zoom, W and S to fly in and out, drag to turn, B switches between the host band and the whole range."></canvas>
    <div id="err"></div>
    <script type="module">
      import { createDrawer } from "./draw.js";
      import { createTextProvider } from "./text.js";
      const q = new URLSearchParams(location.search);
      const canvas = document.getElementById("c");
      const fail = (m) => { const e = document.getElementById("err"); e.style.display = "grid"; e.textContent = m; document.body.dataset.engine = "failed: " + m; };
      const gl = canvas.getContext("webgl2", { antialias: true }) || canvas.getContext("webgl", { antialias: true });
      if (!gl) fail("This browser offers no WebGL.");
      const DPR = q.get("dpr") ? Number(q.get("dpr")) : devicePixelRatio;
      const text = createTextProvider(gl, { dpr: DPR });
      let w = null;
      const enc = new TextEncoder(), dec = new TextDecoder();
      const env = {
        host_text(ptr, len, style, out) {
          const s = dec.decode(new Uint8Array(w.memory.buffer, ptr, len));
          const p = text.place(s, style);
          const o = new Float32Array(w.memory.buffer, out, 8);
          o[0] = p.w; o[1] = p.h; o[2] = p.u0; o[3] = p.v0; o[4] = p.u1; o[5] = p.v1; o[6] = p.page;
          o[7] = p.drawn === undefined ? -1 : p.drawn;   // 0 whole, 1 cut, 2 changed, -1 not said
        },
      };
      const { instance } = await WebAssembly.instantiate(await (await fetch("holon_draw_ladder.wasm")).arrayBuffer(), { env });
      w = instance.exports;
      window.holonLadder = w;
      const drawer = createDrawer(gl, { text });
      // the host's band: on this page there is no host, so with the switch OFF the ladder draws the
      // whole range itself (an empty band); with it ON the zoom is held to the twin's street-to-globe
      // band (stand-in values, log10 metres per device pixel), where the twin, not this page, draws
      const BAND = [Number(q.get("lo") || -1.0), Number(q.get("hi") || 4.2)];
      const hosted = q.has("lo") || q.has("hi");
      let clamp = q.get("switch") === "on";
      const setBand = () => clamp ? w.hl_band(BAND[0], BAND[1], 1) : hosted ? w.hl_band(BAND[0], BAND[1], 0) : w.hl_band(0, 0, 0);
      setBand();
      // the zoom (log10 metres per device pixel) eases toward a target, so a wheel notch or a key is
      // a smooth move; it opens on the ground underfoot, at human scale, unless ?z= says otherwise
      const view = { z: q.get("z") ? Number(q.get("z")) : -2.2, yaw: 0.8, pitch: 0.42 };
      let target = view.z;
      const NAV = 0x50000000;
      const zoomBy = (d) => { target = w.hl_clamp_z(target + d); };
      const setLine = () => {
        const s = (clamp ? "switch ON: street to globe" : "switch OFF: universe to vacuum") + "  ·  1 px = 10^" + view.z.toFixed(1) + " m  ·  fly: W/S in and out, A/D, R/F, Q/E, arrows; drag to turn, right-drag to pan";
        const b = enc.encode(s); const p = w.hl_scratch(b.length); new Uint8Array(w.memory.buffer, p, b.length).set(b); w.hl_caption_line(p, b.length);
      };
      // FLIGHT: keys held move continuously. W and S fly in and out (the zoom, two decades a
      // second), A and D slide left and right, R and F up and down (a fifth of the view a second),
      // Q and E turn, the arrow keys turn and tilt; shift goes three times as fast.
      const held = new Set();
      const FLY = new Set(["w", "a", "s", "d", "r", "f", "q", "e", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]);
      addEventListener("keyup", (e) => held.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
      addEventListener("blur", () => held.clear());
      const fly = (dt) => {
        if (!held.size) return;
        const f = (held.has("Shift") ? 3 : 1) * dt, H = canvas.height, m = Math.pow(10, view.z);
        if (held.has("w")) { target = w.hl_clamp_z(target - 2 * f); view.z = w.hl_clamp_z(view.z - 2 * f); }
        if (held.has("s")) { target = w.hl_clamp_z(target + 2 * f); view.z = w.hl_clamp_z(view.z + 2 * f); }
        if (held.has("a")) w.hl_pan_by(-0.2 * H * m * f, 0);
        if (held.has("d")) w.hl_pan_by(0.2 * H * m * f, 0);
        if (held.has("r")) w.hl_pan_by(0, 0.2 * H * m * f);
        if (held.has("f")) w.hl_pan_by(0, -0.2 * H * m * f);
        if (held.has("q") || held.has("ArrowLeft")) view.yaw += 1.2 * f;
        if (held.has("e") || held.has("ArrowRight")) view.yaw -= 1.2 * f;
        if (held.has("ArrowUp")) view.pitch = Math.min(1.45, view.pitch + 0.8 * f);
        if (held.has("ArrowDown")) view.pitch = Math.max(-1.45, view.pitch - 0.8 * f);
      };
      addEventListener("keydown", (e) => {
        const k = e.key;
        const kk = k.length === 1 ? k.toLowerCase() : k;
        if (FLY.has(kk) || k === "Shift") { held.add(kk); if (k.startsWith("Arrow")) e.preventDefault(); return; }
        if (k === "b" || k === "B") { clamp = !clamp; setBand(); target = w.hl_clamp_z(target); view.z = w.hl_clamp_z(view.z); }
        else if (k === "+" || k === "=") { zoomBy(-1); e.preventDefault(); }
        else if (k === "-" || k === "_") { zoomBy(1); e.preventDefault(); }
        else if (k === "PageUp") { zoomBy(-5); e.preventDefault(); }
        else if (k === "PageDown") { zoomBy(5); e.preventDefault(); }
        else if (k === "Home") { act(NAV + 12); e.preventDefault(); }
      });
      // a wheel notch (or a trackpad's equivalent, or a pinch, which browsers send as a wheel with
      // ctrl held) is a third of a decade; lines and pages are converted to pixels first
      // a wheel notch (or a trackpad's equivalent, or a pinch, which browsers send as a wheel with
      // ctrl held) is a third of a decade; lines and pages are converted to pixels first
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const px = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1);
        zoomBy(px * (e.ctrlKey ? 0.01 : 0.0033));
      }, { passive: false });
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("dblclick", (e) => { if (!w.hl_pick(...dev(e))) zoomBy(-1); });
      // the engine's navigation control, and the usual mouse: left-drag orbits, right- or
      // shift-drag pans, wheel or pinch zooms, double-click zooms in
      const dev = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height]; };
            const panBy = (dxPx, dyPx) => { const m = Math.pow(10, view.z); w.hl_pan_by(dxPx * m, dyPx * m); };
      const act = (tag) => {
        const H = canvas.height, step = 0.15 * H;
        switch (tag - NAV) {
          case 2: view.yaw = -Math.PI / 2; break; // north up
          case 3: view.pitch = Math.min(1.45, view.pitch + 0.15); break;
          case 4: view.pitch = Math.max(-1.45, view.pitch - 0.15); break;
          case 5: panBy(0, step); break;
          case 6: panBy(0, -step); break;
          case 7: panBy(-step, 0); break;
          case 8: panBy(step, 0); break;
          case 9: zoomBy(-1); break;
          case 10: zoomBy(1); break;
          case 12: target = w.hl_clamp_z(-2.2); view.yaw = 0.8; view.pitch = 0.42; w.hl_pan_reset(); break;
          case 13: clamp = !clamp; setBand(); target = w.hl_clamp_z(target); view.z = w.hl_clamp_z(view.z); break;
        }
      };
      let drag = null; const touches = new Map(); let pinch = null;
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId); touches.set(e.pointerId, [e.clientX, e.clientY]);
        const [x, y] = dev(e), tag = w.hl_pick(x, y);
        if (tag === NAV + 1) drag = { mode: "ring", x: e.clientX, y: e.clientY, a: Math.atan2(y - w.hl_nav(1), x - w.hl_nav(0)) };
        else if (tag === NAV + 11) { drag = { mode: "slider" }; target = w.hl_clamp_z(w.hl_nav_z(y)); }
        else if (tag) { act(tag); drag = null; }
        else drag = { mode: (e.button === 2 || e.shiftKey) ? "pan" : "orbit", x: e.clientX, y: e.clientY };
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!touches.has(e.pointerId)) return; touches.set(e.pointerId, [e.clientX, e.clientY]);
        if (touches.size === 2) { const [a, b] = [...touches.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) { view.z = w.hl_clamp_z(view.z - 3 * Math.log10(d / pinch)); target = view.z; } pinch = d; return; }
        if (!drag) return;
        const [x, y] = dev(e);
        if (drag.mode === "ring") { const a = Math.atan2(y - w.hl_nav(1), x - w.hl_nav(0)); view.yaw += a - drag.a; drag.a = a; }
        else if (drag.mode === "slider") target = w.hl_clamp_z(w.hl_nav_z(y));
        else if (drag.mode === "pan") { const s = canvas.width / canvas.getBoundingClientRect().width; panBy(-(e.clientX - drag.x) * s, (e.clientY - drag.y) * s); }
        else { view.yaw -= (e.clientX - drag.x) * 0.006; view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + (e.clientY - drag.y) * 0.006)); }
        drag.x = e.clientX; drag.y = e.clientY;
      });
      const up = (e) => { touches.delete(e.pointerId); pinch = null; drag = null; };
      canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
      const batches = []; const pool = [];
      let last = performance.now(), first = true;
      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000); last = now;
        fly(dt);
        view.z += (target - view.z) * Math.min(1, dt * 10); // ease toward the target
        if (Math.abs(target - view.z) < 1e-4) view.z = target;
        const W = canvas.clientWidth * DPR | 0, H = canvas.clientHeight * DPR | 0;
        if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
        gl.viewport(0, 0, W, H);
        gl.clearColor(0.043, 0.059, 0.055, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        text.beginFrame();
        w.hl_advance(dt);
        setLine();
        const epoch = text.epoch;
        let n = w.hl_view(view.z, view.yaw, view.pitch, W, H, DPR, Date.now() / 1000);
        if (text.epoch !== epoch) { w.hl_text_stale(); n = w.hl_view(view.z, view.yaw, view.pitch, W, H, DPR, Date.now() / 1000); }
        for (let p = 0; p < n; p++) {
          const m = w.hl_pass_batches(p); batches.length = 0;
          for (let i = 0; i < m; i++) {
            const b = pool[i] || (pool[i] = { offset: [0, 0, 0] });
            b.kind = w.hl_batch_kind(p, i); b.count = w.hl_batch_count(p, i); b.screen = !!w.hl_batch_screen(p, i); b.coarse = !!w.hl_batch_coarse(p, i);
            b.offset[0] = w.hl_batch_offset(p, i, 0); b.offset[1] = w.hl_batch_offset(p, i, 1); b.offset[2] = w.hl_batch_offset(p, i, 2);
            b.bytes = new Uint8Array(w.memory.buffer, w.hl_batch_ptr(p, i), b.count * 52);
            b.params = new Float32Array(w.memory.buffer, w.hl_batch_params(p, i), 32);
            batches.push(b);
          }
          gl.clear(gl.DEPTH_BUFFER_BIT);
          drawer.draw(batches, new Float32Array(w.memory.buffer, w.hl_pass_vp(p), 16), { viewport: [0, 0, W, H] });
        }
        if (first) { first = false; document.body.dataset.engine = "holon-draw ladder on " + (typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext ? "webgl2" : "webgl1"); document.body.dataset.ready = "1"; }
        window.holonLadderView = view; window.holonLadderTarget = (z) => { if (z !== undefined) target = w.hl_clamp_z(z); return target; };
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
