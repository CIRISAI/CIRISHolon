[package]
name = "holon-closure"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "The closure as an engine type: an object is a lossy view the dynamics never splits, its ledger to its neighbours, its rent, the grammar that rewrites it, its edge at a resolution and its phase"

# ZERO dependencies, std only — the same isolation profile as `q-seam`, `holon-lens` and
# `holon-qasm`, so this crate cannot perturb the core's feature resolution or the isolation
# gates in `ci-gates.sh`.
#
# THE DEPENDENCY DIRECTION IS THE WHOLE POINT and is stated here where someone adding a
# dependency will look. `holon-render`, `holon-lattice` and `holon-lens` all depend on THIS
# crate, one-way, so that the one object each of them already has under a different name
# (a water unit, a bonded pair, an H-bond component) is the SAME type in all three. A
# dependency added here on any of the three would make the graph a cycle and the shared
# type impossible; a dependency added here on anything at all would land in `holon-render`'s
# browser artifact, which ships to every visitor.
[dependencies]

# DEV-dependencies only, for REPLACE-1's driver (`examples/replace1.rs`) and its plants
# (`tests/replace1_plants.rs`): the driver reads the walks through `holon-lens` and puts the
# circuit case (G4) to `holon::sector`. Neither is a runtime dependency — nothing here ships in
# `holon-render`'s artifact, and the direction above (`holon-lens` and `holon` depend on THIS
# crate) is unchanged; a dev-dependency cycle is how cargo lets a crate's own tests exercise
# its dependents.
[dev-dependencies]
holon-lens = { path = "../holon-lens" }
holon = { path = "../holon" }
