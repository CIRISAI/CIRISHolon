[package]
name = "holon-draw-ladder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "One zoom from the vacuum to the universe, drawn by holon-draw: a rung per scale, each labelled with where what it shows comes from"

[dependencies]
holon-draw = { path = "../holon-draw" }
holon-draw-atoms = { path = "../holon-draw-atoms" }
# zero-dependency, std only: decodes the stored gluon field the gauge4 rung draws
holon-gauge4 = { path = "../holon-gauge4" }

[lib]
crate-type = ["cdylib", "rlib"]
