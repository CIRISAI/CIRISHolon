description = "A small generic draw core: tiles of tagged instance records, a pure pick, a per-mark report and a detail allocator behind one interface (INTERFACE.md)"

# ZERO dependencies, std only: the isolation profile of `q-seam` and `holon-closure`. This
# crate ships to every visitor of a consumer's page, so a dependency added here is a
# download added there. The graphics backend is NOT here: the core packs bytes and answers
# questions; a backend uploads and draws.
