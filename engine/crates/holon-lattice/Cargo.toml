# holon-lattice: the continuum-native fluid tier, on its OWN dynamics.
#
# Dependency profile matches `holon-mesh`'s and is deliberate: the ONLY runtime dep is
# `ciris-sim-core` with `alloc`, which carries no optional features of its own beyond
# alloc/std, so this crate cannot perturb the core's feature resolution or `ci-gates.sh`'s
# isolation gates. It depends on that crate specifically to reuse `regplus::DIRECTIONS`
# and `regplus::sector` rather than re-declaring them — a second declaration of the
# direction set is how the two come to disagree, and `regplus`'s is the one
# `CIRISOntology/Core/Lattice.lean` pins.

[package]
name = "holon-lattice"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "FHP-6 / HPP-4 lattice gas as its own closed-tier candidate: exact conservation, the collision classification, and the closure defect law"

[dependencies]
ciris-sim-core = { path = "../ciris-sim-core", features = ["alloc"] }

# holon-closure: ONE definition of the closure, shared with holon-render and holon-lens so
# that a water unit, a bonded pair and an H-bond component are the SAME type. It has ZERO
# dependencies of its own and no optional features (its manifest says why), so the
# one-runtime-dep isolation argument above is unchanged in substance: the graph is still
# only crates that carry no optional feature at all, and this crate still cannot perturb the
# core's feature resolution or ci-gates.sh's isolation gates. `src/closure.rs` is a thin
# adapter over `orientation::bond_graph` and `chart::BlockChart`; neither moves.
holon-closure = { path = "../holon-closure" }

# DEV-only: tests/fchc_control.rs runs holon-mesh's FCHC-24 enumerator so G11's second leg
# is discharged under this campaign's own invocation rather than cited from another crate's
# suite. A dev-dependency leaves the library's runtime profile at one crate, so the isolation
# argument above is untouched.
[dev-dependencies]
holon-mesh = { path = "../holon-mesh" }

# DEV-only: EDGE-0's runner (`examples/edge0_lattice.rs`) is the campaign harness's first
# adopter from this crate — gates that name every failing leg, plants whose carrier and
# analytic reach are checked before any measurement, a price that must be written before it
# can be spent, stakes carrying their read inputs, and a record writer that refuses
# malformed JSON. A dev-dependency leaves the LIBRARY's runtime profile at the two crates
# above it, so the isolation argument at the top of this file is untouched: nothing in
# `src/` may depend on it, and nothing does.
holon-campaign = { path = "../holon-campaign" }
